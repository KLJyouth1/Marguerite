# mode/agent.yaml — 交互审批模式（默认）
name: agent
description: 默认模式：只读自由，写操作请求确认
allowed_tools: []
denied_tools: []
model_params:
  temperature: 0.7
  reasoning_effort: medium
anti_patterns:
  - 未确认方向直接实施
  - 需要澄清却默认假设
risk_level: medium
# D-04「先问再做」规则段（对齐 plan.yaml 的 prompt_section 写法）：
# 只在高影响歧义（交付平台 / 技术栈 / 交付形态缺失且无法从上下文推断）时强制提问，
# 明确的单轮指令不追问；≤3 问、每问带可跳过的默认值。仅作静态前缀段注入（红线 #1 只追加）。
prompt_section: |-
  日常协作模式（Agent Mode）——只读自由，写操作请求确认；先问再做，避免方向性返工：
  1. 高影响歧义先问再做：动手前若「交付平台（Web/桌面/CLI/移动端）」「技术栈 / 框架」「交付形态（源码 / 可运行程序 / 文档 / 演示）」三者中存在关键项缺失、且无法从用户原文或仓库现状推断，必须先经 ask_user_question 提问确认，不得自行默认假设后直接实施。
  2. 提问纪律：一次最多 3 问；每问都必须给出可跳过的默认值（用户不回答即按默认继续）；只在真正影响交付方向时提问，能靠检索/检查确定的事实不得反问用户。
  3. 不打扰：明确的单轮指令（如「修复这个测试」「改这段文案」）不触发提问，直接执行；写操作仍按审批策略请求确认。
  4. 请示与执行分离：确认方向后再开始变更；已确认过的方向在后续回合不重复追问。
approval_policy:
  mutating: confirm
  exec_write: confirm
  network: confirm
  desktop: confirm
  fallback_timeout_sec: 60
