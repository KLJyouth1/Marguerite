# mode/omni_transcend.yaml — 超星 x · 全谱超模（Omni-Transcend）
#
# 复合模式：先定轨 → 再深想 → 后狂做 → 全程可视
# ────────────────────────────────────────────────────────────────
# 一、锚定加强 · 多阶段晋升（梁神 2 阶段 → 本模式 5 段渐进，工具面单调扩展）
#   S1 定轨（Anchored）  ：首块文本前缀门控(deepseek we 且无 let me → 晋升)；
#     仅暴露 2 最小工具（bash_persistent + str_replace_editor）+ 单行 persona；
#     bootstrap_max_tokens=1024 压住触发窗；promote_after_first_response=true。
#   S2 只读探索（Plan 段）: 晋升后 PTC 单一 run_code，只读摸库/识别依赖，禁写（本段无写面）。
#   S3 深想（MAX 段）     : thinking_depth=4 + verification_passes=4 + reasoning_effort=max，
#     生成→批判→改进→验证四阶段，temperature 0.1。
#   S4 执行（YOLO×PTC 融合革新）: 见下方「二」。快照 + auto_revert_max=3 安全网。
#   S5 全域（Full）      : DEEP 双模型 + SWARM 蜂群(max 13) + AUTO 闭环(160k/24 步/3 修)，
#     视觉(LSP/截屏 OCR)与成本/缓存追踪由工作台消费。
# 二、YOLO×PTC 执行融合（原理与逻辑）
#   PTC（程序化工具调用）让「想的轨迹」直接落到「可执行动作」：晋升后激活单一 run_code，
#   由它把 MAX 四阶段产出的编辑/命令意图程序化驱动工具矩阵（bash_persistent/str_replace_editor
#   在 S1 已锚定，单调扩展不撤回）；YOLO（免确认自动）则移除人机审批延迟：auto_approve=true +
#   allowed_tools 全开 + auto_retry_failures=5；两者叠加 = 「只读探索零误写(S2) → 高速执行零等待(S4)」，
#   错误由 verification_passes=4 + CompletionGate + Git 快照回滚兜底——快速而不失控。
# 三、红线（同 Bloom，代码侧强制）：禁止全上下文重注入；工具面单调扩展（S1→S5 只加不撤）；
#   禁止半途切回 Plan/Agent 确认路径。
name: omni-transcend
description: |
  超星 x · 全谱超模：梁神两阶段锚定定轨（首轮 2 最小工具 + 单行 persona + 1024 预算），
  多阶段渐进（S1 定轨→S2 Plan 只读探索→S3 MAX 四阶段深想→S4 YOLO×PTC 融合执行→S5 全域增强），
  YOLO 免确认 + Git 快照回滚 + 4 遍验证，DEEP 双模型 + SWARM 蜂群 + AUTO 自主闭环，
  工具面单调扩展（红线守卫），面向复杂任务推理与执行满分。
allowed_tools: []
denied_tools: []
model_params:
  temperature: 0.1
  reasoning_effort: max
anti_patterns:
  - 禁止全上下文重注入（每轮只增量追加消息；禁止替换 system / 回滚整段历史）
  - 避免中途替换工具面（S1→S5 工具单调扩展；S4 不得回退到 S1 工具集）
  - 禁止在 Omni-Transcend 内切换到 Plan/Agent 的确认路径（auto_approve 全程一致）
risk_level: high
bloom:
  privileges:
    auto_approve: true
    skip_permissions: false
    allowed_tools: "*"
    max_concurrent_tools: 20
    auto_retry_failures: 5
    unrestricted_filesystem: false
    allow_network_all: true
    allow_shell_all: true
    deep_dual_model: true
  sandbox:
    type: workspace-write
    network_access: true
  thinking_depth: 4
  verification_passes: 4
  reasoning_effort: max
  temperature: 0.1
  snapshot_enabled: true
  auto_revert_max: 3
  max_swarm_shards: 13
  max_sub_experts: 6
  auto_retry_failures: 5
  budget_tokens: 160000
  max_iterations: 24
  max_fixes: 3
  anchoring:
    enabled: true
    prefix_gate: "deepseek"
    minimal_tools: ["bash_persistent", "str_replace_editor"]
    ptc_tool: "run_code"
    fallback_steps: 4
    message_sources: ["user", "goal"]
    bootstrap_max_tokens: 1024
    deferred_sources: ["agent-instructions", "skill-catalog"]
    deferred_grace_steps: 1
    promote_after_first_response: true
approval_policy:
  mutating: allow
  exec_write: allow
  network: allow
  desktop: allow
  fallback_timeout_sec: 60
