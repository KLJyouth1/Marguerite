# mode/plan.yaml — 只读探索模式
name: plan
description: 只读探索，必须先产出书面计划，审批后才可执行
allowed_tools:
  - read_file
  - search_files
  - find_files
  - list_dir
  - git_status
  - git_diff
  - git_log
  - web_search
  - lsp
  - syntax
  - semantic
  - fact
  - contract
denied_tools:
  - edit_file
  - write_code
  - create_file
  - delete_file
  - rename_file
  - exec
  - terminal
  - run_tests
  - control_desktop
  - browser_control
  - git_commit
  - install_dependency
model_params:
  temperature: 0.3
  reasoning_effort: high
anti_patterns:
  - 直接修改文件
  - 未计划先执行
  - 跳过审批
risk_level: low
# DSH plan-mode 同款规则段（融合自 standard 预设 plan-mode section，适配本仓工具面：
# exit_plan_mode 语义由 PlanGate 审批落地；仅作为静态前缀段注入，遵守红线 #1 只追加不重写）
prompt_section: |-
  计划模式（Plan Mode）——只读探索，先产出书面计划，审批通过后才可执行：
  1. 探索优先：先用只读检索、搜索、静态分析把计划锚定在真实仓库；不得修改或创建文件、改动配置、跑格式化或会重写已跟踪文件的生成器、提交，或执行计划本体。
  2. 工具目录跨模式保持不变（保证请求缓存稳定）；本规则覆盖任何后续建议使用变更类工具的指引，变更类工具仅登记、不调用。
  3. 能靠检查确定的事实必须靠检查确定；ask_user_question 只用于用户自有的选择或检查无法裁决的实质歧义，不要问用户代码在哪、现状如何。
  4. 计划要决策完备：目标与成功标准；按子系统分组变更；公开 API、模式与数据流变更；边界、失败模式、测试与验收标准、显式假设；简洁可审、详细到他人无需再拍设计决策即可实施。
  5. 完成后经唯一计划提交入口（exit_plan_mode 语义，由 PlanGate 审批落地）以完整 Markdown 提交计划（以 # 标题开头）；该调用须为当轮唯一且最后的工具调用；不要以普通回复或提问代替提交。审批拒绝则吸收反馈后重新提交。
approval_policy:
  mutating: confirm
  exec_write: confirm
  network: confirm
  desktop: confirm
  fallback_timeout_sec: 60
