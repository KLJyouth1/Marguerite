[package]
name = "marguerite-core"
version = "0.1.0"
edition = "2021"
description = "Marguerite CLI Workbench - Core Engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
dirs = "*"
tracing-appender = "0.2"
regex = "1.5.5"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3.7"
tokio = { version = "1.44.2", features = ["full"] }
chrono = { version = "0.4.20", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6"
async-trait = "0.1"
yrs = "0.27"
tokio-stream = "0.1"
ratatui = "0.28"
crossterm = "0.28"

# 浏览器桥：Chrome DevTools Protocol over WebSocket（本地 ws://，无需 TLS）
tokio-tungstenite = "0.24"

# 会话回滚：增量 tar 快照 + sha256（原始未压缩，避免 C 工具链依赖）
sha2 = "0.10"
md5 = "0.8"
tar = "0.4.36"
ruzstd = "0.9"

# 模型密钥加密（BYOK）：纯 Rust AES-256-GCM（Fernet 风格令牌，无 openssl 依赖，Windows MSVC 可直接编译）
aes-gcm = "0.10.3"
base64 = "0.22"
rand = "0.8"

# 幻觉护栏：语法检查（tree-sitter）
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

# 统一网关：HTTP 静态托管 + WebSocket JSON-RPC（仅回环 127.0.0.1）
axum = { version = "0.8", features = ["ws"] }

# 真实语义嵌入后端（可选，feature=real-embed）：本地 MiniLM 等 sentence-transformers 模型。
# 首次使用需下载模型权重（约 80MB），离线不可用；未启用 feature 时引擎保持零依赖特征哈希。
fastembed = { version = "3", optional = true }

[dev-dependencies]
tokio-test = "0.4"

# OS 级沙箱：Linux Landlock 仅在 linux target 编译，不影响 Windows/macOS 构建。
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# 桌面自动化（Epic C）：WPS 演示经 Windows COM 生成 .pptx。仅 Windows target 编译，
# 非 Windows（linux/macOS）下 desktop_automation 模块的 COM 驱动不进入编译（cfg(windows)）。
# uiautomation / enigo 暂不引入（UiaDriver / InputDriver 为可编译骨架，返回 UnsupportedAction，
# 避免与 windows 0.62 的 Win32 COM/OLE 类型产生版本冲突；优先级：crate 必须可编译）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.1", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Globalization",
] }

# 测试工具导出：允许 desktop/tui 等消费 crate 在集成测试中复用 RecordingGitRunner 等桩。
[features]
test-utils = []
# 真实语义嵌入后端：编译进 fastembed + OrtEmbedding，config.embeddings.backend=model 时生效。
# 注意：ort 的 download-binaries 构建脚本需 TLS 提供方，须额外 `ort = { version = "=2.0.0-rc.13",
# optional = true, features = ["tls-rustls"] }` 并在 real-embed 中加 "dep:ort"（见交付说明）。
real-embed = ["dep:fastembed"]