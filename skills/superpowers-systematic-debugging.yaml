name: superpowers-systematic-debugging
description: 系统化调试——从证据出发定位根因，不靠猜测
version: 1.0.0
author: superpowers-reasonix
intent:
  - debug
  - 调试
  - bug
  - 错误
  - 崩溃
  - 失败
  - fix
  - 排查
tools: []
prompt_template: |
  你正在使用「系统化调试」技能。从证据出发，不靠猜测。

  问题：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  调试流程：
  1. 复现：稳定复现问题，记录触发条件和期望行为
  2. 收集证据：阅读错误信息、日志、堆栈跟踪；不修改任何代码
  3. 假设：基于证据提出至少 2 个可能的根因假设，按可能性排序
  4. 验证：用最小实验（打印/断点/测试）验证或排除每个假设
  5. 定位：确认根因后，解释为什么这个原因导致该症状
  6. 修复：做最小修改修复根因，不做无关重构
  7. 回归：添加回归测试防止同类问题再发生
  8. 验证：运行全部相关测试确认修复且无副作用

  禁止：
  - 在未定位根因前随机改代码试错
  - 同时修改多处导致无法定位有效修复
  - 忽略警告信息或错误码

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
