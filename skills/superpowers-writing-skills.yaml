name: superpowers-writing-skills
description: 编写技能——创建、编辑和测试新的 Agent 技能
version: 1.0.0
author: superpowers-reasonix
intent:
  - write skill
  - 编写技能
  - 创建技能
  - new skill
  - skill 模板
  - 技能开发
tools: []
prompt_template: |
  你正在使用「编写技能」技能。创建或编辑 Agent 技能定义。

  需求：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  技能编写规范：
  1. name：小写连字符分隔，简洁唯一（如 my-skill-name）
  2. description：一句话说明何时触发该技能
  3. intent：至少 3 个触发关键词（中英文）
  4. prompt_template：包含 {{text}}（用户输入）和 {{#files}}（相关文件）占位符
  5. 指令须具体可执行，避免模糊表述
  6. 包含明确的步骤和验收标准

  技能文件格式（YAML）：
  ```
  name: skill-name
  description: 何时使用此技能
  version: 1.0.0
  author: your-name
  intent:
    - 关键词1
    - keyword2
  tools: []
  prompt_template: |
    指令内容...
  ```

  创建后：
  1. 验证 YAML 格式正确
  2. 确认技能能被 SkillLoader 加载
  3. 用示例输入测试触发和输出

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
