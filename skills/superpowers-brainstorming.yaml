name: superpowers-brainstorming
description: 将粗略想法转化为经批准的设计方案——在任何构建工作之前使用
version: 1.0.0
author: superpowers-reasonix
intent:
  - brainstorm
  - 头脑风暴
  - 设计
  - design
  - 方案
  - idea
  - 想法
  - 架构
tools: []
prompt_template: |
  你正在使用「头脑风暴」技能。在开始任何构建工作之前，将粗略想法转化为经批准的设计。

  任务：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  执行步骤：
  1. 重述问题：用一句话清晰描述要解决的核心问题
  2. 列出约束：时间、技术栈、兼容性、性能等硬性约束
  3. 发散方案：至少提出 3 个本质不同的方案，列出各自优劣
  4. 推荐方案：选择一个方案并说明理由，标注关键风险
  5. 定义验收：列出可验证的完成标准
  6. 等待批准：在用户确认设计前不写任何实现代码
