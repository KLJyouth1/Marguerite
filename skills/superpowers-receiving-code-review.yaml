name: superpowers-receiving-code-review
description: 接收代码审查——在实施反馈前先理解每条意见
version: 1.0.0
author: superpowers-reasonix
intent:
  - review
  - 代码审查
  - code review
  - 反馈
  - 审查意见
  - 修改意见
tools: []
prompt_template: |
  你正在使用「接收代码审查」技能。在实施审查反馈前，先完整理解每条意见。

  审查意见：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  处理流程：
  1. 通读全部意见，不急于修改
  2. 分类每条意见：
     - 必须修（bug/安全/逻辑错误）
     - 建议改（可读性/命名/结构）
     - 可讨论（设计分歧/个人偏好）
  3. 对「必须修」项：逐一修复，每条引用审查意见原文
  4. 对「建议改」项：采纳并实施，或说明不采纳理由
  5. 对「可讨论」项：回复你的观点和替代方案，寻求共识
  6. 修复后重新运行测试
  7. 回复审查者：逐条说明处理结果

  规则：
  - 不情绪化回应，每条意见都是改进机会
  - 不 silently dismiss 任何意见
  - 不确定时主动提问而非猜测
