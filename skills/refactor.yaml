name: refactor
description: 重构代码，提高可读性和可维护性
version: 1.0.0
author: marguerite
intent:
  - refactor
  - 重构
  - 优化
  - improve
tools: []
prompt_template: |
  请重构以下代码，提高可读性和可维护性：

  {{text}}

  重构要求：
  1. 保持原有功能不变
  2. 提高代码可读性
  3. 应用设计模式（如适用）
  4. 添加必要的注释
  5. 提供重构前后的对比

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
