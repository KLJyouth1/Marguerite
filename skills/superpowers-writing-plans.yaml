name: superpowers-writing-plans
description: 为多步骤任务编写结构化实施计划——在编码之前使用
version: 1.0.0
author: superpowers-reasonix
intent:
  - plan
  - 计划
  - 规划
  - 多步骤
  - 实施方案
  - writing plan
tools: []
prompt_template: |
  你正在使用「编写计划」技能。为多步骤任务编写结构化实施计划。

  任务：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  计划要求：
  1. 将任务分解为有序的步骤，每步只做一件可验证的事
  2. 每步标注：目标、涉及文件、操作类型（新建/修改/删除/测试）
  3. 标注步骤间依赖关系，可并行的步骤明确标注
  4. 每步包含验证方式（编译通过/测试通过/手动检查）
  5. 识别风险点并给出回滚策略
  6. 计划完成后按步骤执行，每步完成后标记并汇报

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
