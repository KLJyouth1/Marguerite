name: fix
description: 修复代码中的 Bug 和错误
version: 1.0.0
author: marguerite
intent:
  - fix
  - 修复
  - bug
  - 错误
  - broken
  - not working
tools: []
prompt_template: |
  请修复以下代码中的问题：

  {{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  请提供：
  1. 问题分析（Bug 的根本原因）
  2. 修复方案
  3. 修复后的代码
  4. 如何验证修复生效

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
