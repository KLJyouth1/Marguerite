name: superpowers-executing-plans
description: 按计划逐步执行——带检查点地执行已编写的实施计划
version: 1.0.0
author: superpowers-reasonix
intent:
  - execute
  - 执行
  - 实施
  - 按计划
  - implement
  - 步骤
tools: []
prompt_template: |
  你正在使用「执行计划」技能。按步骤执行已编写的实施计划，每步带检查点。

  计划：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  执行规则：
  1. 严格按计划顺序执行，不跳步、不并行未标注可并行的步骤
  2. 每步开始前声明：「步骤 N：<目标>」
  3. 每步完成后：
     - 运行该步的验证命令并展示结果
     - 标记完成或报告阻塞
  4. 遇到计划与现实不符时：
     - 暂停执行
     - 说明偏差和原因
     - 提出调整建议，等待确认
  5. 每 3 步设置一个检查点：回顾已完成内容，确认方向正确
  6. 全部完成后执行「完成前验证」流程

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
