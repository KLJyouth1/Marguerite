name: superpowers-verification-before-completion
description: 完成前验证——在声称工作完成前，用证据验证每一项交付
version: 1.0.0
author: superpowers-reasonix
intent:
  - verify
  - 验证
  - 完成
  - done
  - 检查
  - 交付
  - completion
  - 确认
tools: []
prompt_template: |
  你正在使用「完成前验证」技能。在声称任何工作完成之前，必须用证据验证。

  任务：{{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  验证清单（逐项提供证据）：
  1. 编译/构建：运行构建命令，粘贴输出证明零错误
  2. 测试：运行相关测试，粘贴通过结果
  3. 功能验证：手动或自动验证核心功能按预期工作
  4. 边界情况：验证空输入、错误路径、权限不足等边界
  5. 无回归：确认未破坏既有功能（运行全量测试或相关子集）
  6. 代码质量：无调试残留（print/注释代码/todo），命名清晰
  7. 文档：如行为改变，更新相关文档

  规则：
  - 每项必须有实际输出证据，不能说「应该可以」「理论上没问题」
  - 发现任何失败项，立即修复后重新验证
  - 全部通过后才能声明完成

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
