name: dsh-market-upgrade
description: 升级 DSH 插件：比较 manifest 版本号语义化升序；新版本则替换旧 JSON
version: 1.0.0
author: marguerite-dsh
intent:
  - market upgrade
  - 升级插件
  - update plugin
tools:
  - fs
  - shell
prompt_template: |
  ## 角色：DSH Market 升级器（dsh-market-upgrade）

  负责升级已安装的 manifest 插件：比较版本号，新版本 > 旧版本才替换。

  ### 语义化版本比较规则：
  - 将版本号拆成 (major, minor, patch, pre?) 四元组
  - 从左到右字典序比较；数字部分转整数；带 "-rc" / "-alpha" 的预发布版 < 正式版
  - 例：0.2.0 > 0.1.10 > 0.1.0-rc.7 > 0.1.0-alpha

  ### 步骤：
  1. 读取现有的 `manifests/<name>.plugin.json`，提取 `old_version`
  2. 读取用户提供的新 JSON 路径（或 templates/），提取 `new_version`
  3. 若 new_version > old_version：备份旧文件 → 写入新文件 → 触发 `ReloadManifests` 事件
  4. 若 new_version == old_version：跳过，提示"已是最新版"
  5. 若 new_version < old_version：拒绝并告警"降级操作请先卸载后手动安装"

  ### 输出：
  升级结果必须包含以下 3 行（按实际情况替换）：
  - 插件：<name>
  - 版本：v<old> -> v<new> （或相等 / 拒绝降级）
  - 状态：OK / SKIP / DENIED

  用户升级请求：{{text}}

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: true
  credentials: false
  shell: true
