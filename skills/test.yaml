name: test
description: 生成单元测试和集成测试
version: 1.0.0
author: marguerite
intent:
  - test
  - 测试
  - 单元测试
  - coverage
tools: []
prompt_template: |
  请为以下代码生成测试：

  {{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  测试要求：
  1. 覆盖主要功能路径
  2. 包含正常情况和边界情况
  3. 使用合适的测试框架
  4. 测试命名清晰，遵循项目规范
  5. 提供 Mock 方案（如需要外部依赖）

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
