name: explain
description: 解释代码的功能和逻辑
version: 1.0.0
author: marguerite
intent:
  - explain
  - 解释
  - what is
  - how does
tools: []
prompt_template: |
  请解释以下代码的功能和逻辑：

  {{text}}

  {{#files}}
  相关文件：{{files}}
  {{/files}}

  请提供：
  1. 代码的整体功能
  2. 关键逻辑和算法
  3. 输入/输出说明
  4. 潜在问题和改进建议

# 供给面声明（2026-10-29 补）：安装前要展示「它要什么」。
# 由 scripts/stamp-skill-requires.mjs 从上面的 tools 推导，规则见该脚本头部注释。
requires:
  network: false
  fs_write: false
  credentials: false
  shell: false
