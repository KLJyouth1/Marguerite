[package]
name = "marguerite-gui"
version = "0.2.18"
description = "Marguerite CLI Workbench - Tauri GUI Shell"
edition = "2021"

[lib]
name = "marguerite_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 见下方 [dependencies] 中的同名说明：必须放在 build-dependencies —— schemars 位于
# proc-macro/build 依赖图，resolver=2 下普通 [dependencies] 的特性不会并集进来。
indexmap = { version = "1", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# 自动更新：签名密钥从环境变量 TAURI_SIGNING_PRIVATE_KEY 读取，不硬编码。
# 发版前需在 CI / 本机设置该 env var + TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
tauri-plugin-updater = "2"
tokio = { version = "1.44.2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
marguerite-core = { path = "../../core" }
