name: Feature request
description: Propose a capability, an API or a workflow improvement.
title: "[feat] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Marguerite is deliberately small in its core: one Rust engine, three
        front ends, one loopback gateway, no public network listener. Proposals
        that fit that shape land much faster — please read
        [CONTRIBUTING.md](../../CONTRIBUTING.md) (architecture invariants) before
        writing a large design.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and discussions for this idea.
          required: true
        - label: This request does not require exposing the gateway or ACP beyond loopback.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Marguerite do instead? Sketch the CLI verb / RPC method / UI surface if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, existing commands or external tools you tried.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Where should this live?
      multiple: true
      options:
        - CLI (`marguerite ...`)
        - TUI (`marguerite-tui`)
        - Desktop app (Tauri, `gui/`)
        - Web console (`webui/`)
        - Python sidecar (`pyengine/`)
        - Engine / core (`core/`)
        - Docs / build / packaging
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
        - label: I can help test a proposed implementation on my platform.
          required: false
